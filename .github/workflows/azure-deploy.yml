# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - archemapp

on:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests (if available)
        run: npm test --if-present

      - name: Build application (if available)
        run: npm run build --if-present

      - name: Create deployment package
        run: |
          # Create a clean deployment package excluding dev dependencies and unnecessary files
          mkdir deployment-package
          
          # Copy only necessary files (exclude large directories from the start)
          rsync -av --exclude='node_modules' \
                    --exclude='.git' \
                    --exclude='.github' \
                    --exclude='uploads/bin' \
                    --exclude='uploads/fbx' \
                    --exclude='uploads/glb' \
                    --exclude='uploads/gltf' \
                    --exclude='uploads/mtl' \
                    --exclude='uploads/obj' \
                    --exclude='public/jmol-16.1.41' \
                    --exclude='*.pem' \
                    --exclude='*.csr' \
                    --exclude='third year - Shortcut.lnk' \
                    --exclude='.vscode' \
                    --exclude='*.log' \
                    . deployment-package/
          
          cd deployment-package
          
          # Install only production dependencies
          npm ci --only=production --no-audit --no-fund

      - name: Zip artifact for deployment
        run: |
          cd deployment-package
          zip -r ../release.zip . -x "*.git*" "node_modules/.cache/*"

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: release.zip

  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build
    environment: production
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Unzip artifact for deployment
        run: unzip release.zip
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'archemapp'
          slot-name: 'Production'
          package: .
