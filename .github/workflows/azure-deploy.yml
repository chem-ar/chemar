# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - archemapp

on:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests (if available)
        run: npm test --if-present

      - name: Build application (if available)
        run: npm run build --if-present

      - name: Create deployment package
        run: |
          # Create a clean deployment package excluding dev dependencies and unnecessary files
          mkdir deployment-package
          cp -r . deployment-package/
          cd deployment-package
          
          # Remove development files and large files that shouldn't be deployed
          rm -rf node_modules
          rm -rf .git
          rm -rf .github
          rm -rf uploads/bin uploads/fbx uploads/glb uploads/gltf uploads/mtl uploads/obj
          rm -rf public/jmol-16.1.41
          rm -f *.pem *.csr
          rm -f "third year - Shortcut.lnk"
          
          # Install only production dependencies
          npm ci --only=production

      - name: Zip artifact for deployment
        run: |
          cd deployment-package
          zip -r ../release.zip . -x "*.git*" "node_modules/.cache/*"

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: release.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment: production
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Unzip artifact for deployment
        run: unzip release.zip
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'archemapp'
          slot-name: 'Production'
          package: .
